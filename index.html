<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b222b">
<title>Sharko Matches</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/results.css">
<link rel="stylesheet" href="css/profile.css">
<link rel="stylesheet" href="css/market.css">
<link rel="stylesheet" href="css/wheel.css">
<link rel="stylesheet" href="css/lobby.css">
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>
<div class="phone" id="phone">
  <div class="statusbar" aria-hidden="true">
    <span>9:41</span>
    <span class="sb-icons"><i data-icon="signal"></i><i data-icon="wifi"></i><i data-icon="battery"></i></span>
  </div>

  <!-- HOME -->
  <section class="screen screen-home is-active" id="screen-home" data-screen="home">
    <img class="home-bg" src="assets/img/home-bg.jpg" alt="">
    <div class="balance" data-balance></div>
    <button class="bell" id="bell-btn" aria-label="Notifications">
      <i data-icon="bell"></i><span class="badge" id="bell-badge">3</span>
    </button>
    <div class="bubble" id="guide-bubble" aria-live="polite">
      <div class="swap-wrap"><strong id="guide-title"></strong><p id="guide-text"></p></div>
      <svg class="bubble-tail" viewBox="0 0 46 24" aria-hidden="true"><path d="M14 0 L6 20 L30 18 L44 0 Z" fill="#fdf6e6"/><path d="M14 1.5 L6 20 L30 18 L43 1.5" fill="none" stroke="#1d1a2e" stroke-width="3" stroke-linejoin="round"/></svg>
    </div>
    <button class="carousel-arrow left" id="guide-prev" aria-label="Previous tip"><i data-icon="chev-left"></i></button>
    <button class="carousel-arrow right" id="guide-next" aria-label="Next tip"><i data-icon="chev-right"></i></button>
    <div class="guide-badge"><span>Your guide</span><b>Sharko</b></div>
    <button class="btn-gold play-btn" data-go="matches">
      <i data-icon="swords"></i>Play now
      <span class="live-pill"><span class="live-dot"></span>LIVE</span>
    </button>
    <div class="dots" id="guide-dots"></div>
  </section>

  <!-- MARKET (rendered by js/market.js) -->
  <section class="screen screen-market" id="screen-market" data-screen="market"></section>

  <!-- MATCHES -->
  <section class="screen screen-matches" id="screen-matches" data-screen="matches">
    <header class="topbar"><div class="balance" data-balance></div></header>
    <div class="page-head">
      <h1 class="page-title">Matches</h1>
      <p class="page-sub">Pick a match and start a party</p>
    </div>
    <div class="search-row">
      <label class="search">
        <i data-icon="search"></i>
        <input id="search-input" type="search" placeholder="Search team, league or stadium" autocomplete="off">
      </label>
      <button class="btn-gold filter-btn" id="filter-btn" aria-label="Filters" aria-expanded="false"><i data-icon="sliders"></i><span class="filter-count" id="filter-count" hidden></span></button>
    </div>
    <div class="section-label">All matches <span class="count-pill" id="match-count">0</span><button class="join-code" id="join-code-btn" type="button"><i data-icon="key"></i>Join with code</button></div>
    <div class="card-list" id="match-list"></div>

    <div class="filter-scrim" id="filter-scrim" hidden></div>
    <div class="filter-panel" id="filter-panel" hidden role="dialog" aria-label="Filters">
      <div class="fp-head"><h3>Filters</h3><button class="link-btn" id="filter-reset">Reset</button></div>
      <div class="fp-group"><h4>Country</h4><div class="chips" id="chips-country"></div></div>
      <div class="fp-group"><h4>League</h4><div class="chips" id="chips-league"></div></div>
      <div class="fp-group"><h4>When</h4><div class="chips" id="chips-when"></div></div>
      <button class="btn-gold fp-apply" id="filter-apply">Show 0 matches</button>
    </div>
  </section>

  <!-- LOBBY WAITING ROOM (replaces Matches while you are in a lobby; rendered by js/lobby.js) -->
  <section class="screen screen-lobby" id="screen-lobby" data-screen="lobby"></section>

  <!-- RESULTS (from results-screen.html, rendered by js/results.js) -->
  <section class="screen screen-results" id="screen-results" data-screen="results"></section>

  <!-- PROFILE (from profile-screen_1.html, rendered by js/profile.js) -->
  <section class="screen screen-profile" id="screen-profile" data-screen="profile"></section>

  <div class="nav-fade" aria-hidden="true"></div>
  <!-- BOTTOM NAV (same on every screen) -->
  <nav class="tabbar" id="tabbar" aria-label="Main">
    <button data-go="home" class="is-active" aria-label="Home"><i data-icon="home"></i></button>
    <button data-go="market" aria-label="Market"><i data-icon="wallet"></i></button>
    <button data-go="matches" aria-label="Matches"><i data-icon="swords"></i></button>
    <button data-go="results" aria-label="Results"><i data-icon="results"></i></button>
    <button data-go="profile" aria-label="Profile"><i data-icon="user"></i></button>
  </nav>
  <div class="home-indicator" aria-hidden="true"></div>

  <!-- Overlays -->
  <div class="popover" id="notif-pop" hidden></div>
  <div class="app-sheet-scrim" id="sheet-scrim" hidden></div>
  <div class="app-sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="app-sheet-handle"></div><div id="sheet-body"></div></div>
  <div class="toast" id="toast" hidden></div>
</div>

<script src="assets/vendor/qrcode.js"></script>
<script src="js/data.js"></script>
<script src="js/stats.js"></script>
<script src="js/app.js"></script>
<script src="js/results.js"></script>
<script src="js/profile.js"></script>
<script src="js/market.js"></script>
<script src="js/wheel.js"></script>
<script src="js/lobby.js"></script>
<script src="js/game.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
